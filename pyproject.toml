[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-platform"
version = "0.1.0"
description = "Enterprise AI Governance & Risk Analytics Platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ram Purmessur", email = "ram.purmessur@gmail.com"}
]
keywords = ["ai", "governance", "risk", "compliance", "guardrails", "llm", "nist", "iso42001"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/yourusername/ai-governance-platform"
Documentation = "https://github.com/yourusername/ai-governance-platform/tree/main/docs"
Repository = "https://github.com/yourusername/ai-governance-platform"
"Issue Tracker" = "https://github.com/yourusername/ai-governance-platform/issues"

[tool.setuptools]
packages = ["ai_governance"]

[tool.setuptools.package-data]
ai_governance = ["data/*.csv"]
